name: Build Cross-Platform Executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: macos-latest
            name: macos-arm64
          - os: ubuntu-latest
            name: linux-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: '3.13'

      - name: Install dependencies
        # HyPyRameter (small, pure Python) and SpiceyPy (5.6 MB, for DSK shape
        # models) ship in every build; PyTorch does not
        run: uv sync --extra hypyrameter --extra spice

      - name: Build with PyInstaller
        # Varda.spec bundles the uv set up above, which Processing > Optional
        # Features uses to install PyTorch on the user's computer
        run: uv run pyinstaller Varda.spec

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # Qt WebEngine (the 3D view) needs these too
          sudo apt-get install -y libegl1 libnss3 libnspr4 libxkbfile1 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libxshmfence1 libgbm1 libasound2t64 libxkbcommon-x11-0

      # Package each platform's download, then unpack that download and
      # self-test the copy: a build that can't start, read and write images,
      # render, run its analyses or load plugins from what users actually get
      # is never released.

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/Varda/* -DestinationPath Varda-${{ matrix.name }}.zip

      - name: Self-test the download (Windows)
        # A windowed app has no console, so the self-test writes a report file
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          VARDA_SELF_TEST_REPORT: ${{ github.workspace }}\self-test.txt
        run: |
          Expand-Archive Varda-${{ matrix.name }}.zip -DestinationPath unpacked
          $p = Start-Process -FilePath unpacked\Varda.exe -ArgumentList '--self-test' -Wait -PassThru
          Get-Content $env:VARDA_SELF_TEST_REPORT
          exit $p.ExitCode

      - name: Package (Linux)
        # A tarball keeps file permissions; install.sh adds Varda to the
        # applications menu
        if: runner.os == 'Linux'
        run: |
          cp packaging/linux/install.sh dist/Varda/
          tar -czf Varda-${{ matrix.name }}.tar.gz -C dist Varda

      - name: Self-test the download (Linux)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          mkdir unpacked
          tar -xzf Varda-${{ matrix.name }}.tar.gz -C unpacked
          unpacked/Varda/Varda --self-test

      - name: Package (macOS)
        # A disk image holding Varda.app and an Applications shortcut to drag
        # it onto. The app must be one signed bundle: macOS then asks the user
        # to approve it once, instead of blocking each library inside it.
        # HFS+ with an open folder set, so Finder shows the volume's window
        # when the image is double-clicked (APFS images just mount silently).
        if: runner.os == 'macOS'
        run: |
          /usr/bin/codesign --verify --deep --strict dist/Varda.app
          mkdir dmg rw-mount
          cp -R dist/Varda.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname Varda -srcfolder dmg -fs HFS+ -format UDRW -ov rw.dmg
          hdiutil attach -nobrowse -noautoopen -mountpoint rw-mount rw.dmg
          python3 packaging/macos/set_open_folder.py rw-mount
          hdiutil detach rw-mount || hdiutil detach -force rw-mount
          hdiutil convert rw.dmg -format UDZO -o Varda-${{ matrix.name }}.dmg

      - name: Self-test the download (macOS)
        if: runner.os == 'macOS'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          hdiutil attach -nobrowse -mountpoint mounted Varda-${{ matrix.name }}.dmg
          python3 packaging/macos/set_open_folder.py --check mounted
          mounted/Varda.app/Contents/MacOS/Varda --self-test
          # The image can stay busy for a moment after Varda exits
          sleep 3
          hdiutil detach mounted || hdiutil detach -force mounted

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Varda-${{ matrix.name }}
          path: Varda-${{ matrix.name }}.*
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.zip
            artifacts/*.dmg
            artifacts/*.tar.gz
          generate_release_notes: true
