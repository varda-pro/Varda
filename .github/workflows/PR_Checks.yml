name: Check Linting, Formatting, and Unit Tests

on:
  pull_request:
    branches:
      - development
      - main

jobs:
  # Formatting check with ruff
  format:
    name: Format (ruff)
    runs-on: ubuntu-latest
    # Non-blocking for now: the codebase isn't fully ruff-formatted yet.
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: '3.13'

      - name: Install dependencies
        run: uv sync

      - name: Run ruff format check
        run: uv run ruff format --check .

  # Linting check with ruff
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    # Non-blocking for now: existing lint backlog (~125 errors).
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: '3.13'

      - name: Install dependencies
        run: uv sync

      - name: Run ruff check
        run: uv run ruff check .

  # Static type checking with ty
  typecheck:
    name: Type check (ty)
    runs-on: ubuntu-latest
    # Non-blocking for now: large type-checking backlog (~387 diagnostics).
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: '3.13'

      - name: Install dependencies
        run: uv sync

      - name: Run ty check
        run: uv run ty check

  # Unit testing with pytest
  pytest:
    name: Unit tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: '3.13'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # Qt WebEngine (the 3D view) needs these too
          sudo apt-get install -y libegl1 libnss3 libnspr4 libxkbfile1 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libxshmfence1 libgbm1 libasound2t64 libxkbcommon-x11-0

      - name: Install dependencies
        run: uv sync

      - name: Run pytest
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest

  # Logic modules must not import Qt (contracts in pyproject.toml); the
  # pytest job below runs every test headless (QT_QPA_PLATFORM=offscreen)
  import-contracts:
    name: Import contracts (import-linter)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: '3.13'

      - name: Install dependencies
        run: uv sync

      - name: Check import contracts
        run: uv run lint-imports

  # The same self-test every release build runs on its bundle (build.yml),
  # here from source so the checks themselves keep working between releases
  self-test:
    name: App self-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: '3.13'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # Qt WebEngine (the 3D view) needs these too
          sudo apt-get install -y libegl1 libnss3 libnspr4 libxkbfile1 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libxshmfence1 libgbm1 libasound2t64 libxkbcommon-x11-0

      - name: Install dependencies
        run: uv sync --extra hypyrameter --extra spice

      - name: Run the self-test
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run varda --self-test

  # CITATION.cff must stay valid so GitHub's "Cite this repository" and Zenodo work
  citation:
    name: Citation file (CFF)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Validate CITATION.cff
        run: uvx cffconvert --validate -i CITATION.cff
