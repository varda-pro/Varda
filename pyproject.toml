[project]
name = "varda"
version = "0.12.1"
description = "An extensible GUI application for analyzing hyperspectral images."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = "~=3.13.0"
authors = [{"name" = "Michael Phillips", "email" = "phillipsm@arizona.edu"},
           {"name" = "Jesse Oved", "email" = "jesseoved@arizona.edu"},
           {"name" = "Emma Elliott", "email" = "emmae@arizona.edu"},
           {"name" = "Hamad Ayaz", "email" = "hamadayaz@arizona.edu"}]

dependencies = [
    "PyQt6>=6.10,<6.11", # WebEngine must match PyQt6's minor version
    # The 3D terrain view is a three.js page in Qt WebEngine
    "PyQt6-WebEngine>=6.10,<6.11",
    "numpy>=2.1.1",
    "matplotlib>=3.9.2",
    "spectral>=0.24,<0.26", # used only through analysis/_spy.py
    "rasterio>=1.4.0",
    "scikit-image>=0.21.0",
    "pyqtgraph>=0.13.7",
    "h5py>=3.15.1",
    "opencv-python>=4.10.0.84",
    "affine>=2.4.0",
    "scipy>=1.15.1",
    "pillow>=10.1.0",
    "pyproj>=3.7.1",
    "pluggy>=1.6.0",
    "appdirs>=1.4.4",
    "pyogrio>=0.11.1",
    "geopandas>=1.1.1",
    "attrs>=25.4.0",
    "numba>=0.63.1",
    "psygnal>=0.15.1",
    "pyqt6ads>=4.5.0",
    "in-n-out>=0.2.1",
    "app-model>=0.5.1",
    "superqt>=0.8.0",
    "pyconify>=0.2.1",
    "pyyaml>=6.0.3",
    "certifi>=2024.2.2",
    "packaging>=24.0",
    "anthropic>=0.60",
    "keyring>=25.0",
    "openai>=1.60",
    "shapely>=2.0",
    "psutil>=7.2.2",
    "astropy>=8.0.2",
    "pvl>=1.3",
]

[project.optional-dependencies]
# Processing > Spectral Parameters > Band Parameters needs HyPyRameter 0.3+
# (on PyPI). Install with
#   uv sync --extra hypyrameter      or      pip install "varda[hypyrameter]"
# Varda runs without it and simply lists that analysis as unavailable.
hypyrameter = [
    "hypyrameter>=0.3",
]
# Processing > Classification > CNN / ViT classifiers need PyTorch (large;
# platform-specific wheels). Install with `uv sync --extra ml`; without it
# those analyses are listed as unavailable.
ml = [
    "torch>=2.4",
]
# 3D Terrain's Shape model surface reads NAIF DSK (type 2) files through
# SpiceyPy. Install with   uv sync --extra spice
# Without it, DSK files are listed as unavailable; other formats still work.
spice = [
    "spiceypy>=6",
]

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "mypy>=1.18.2",
    "pyinstaller>=6.16.0",
    "pytest>=8.4.2",
    "pytest-qt>=4.5.0",
    "ruff>=0.14.5",
    "ty>=0.0.40",
]

[build-system]
requires = ["setuptools>=77"]  # SPDX license expressions (PEP 639)
build-backend = "setuptools.build_meta"

[project.urls]
Homepage = "https://github.com/varda-pro/Varda"
Documentation = "https://github.com/varda-pro/Varda/blob/main/docs/user-guide/README.md"
Source = "https://github.com/varda-pro/Varda"
Issues = "https://github.com/varda-pro/Varda/issues"
Releases = "https://github.com/varda-pro/Varda/releases"
Changelog = "https://github.com/varda-pro/Varda/blob/main/CHANGELOG.md"

[project.gui-scripts]
varda = "varda.main:main"

[project.entry-points."varda.plugins"]

[tool.pytest.ini_options]
pythonpath = ["varda"]
# Release QA (qa/, docs/developer/release-qa.md) drives the whole app as
# first-time users; it runs only when asked: uv run pytest -m qa qa/
addopts = ["-m", "not qa"]
markers = [
    "qa: release-QA persona runs; excluded unless -m qa",
    "slow: takes more than about 10 s; run by default (skip with -m 'not slow and not qa')",
    "qa_env(**variables): environment variables for a QA persona's own process",
]
# Varda must not use its own deprecated APIs (varda.common.deprecation)
filterwarnings = [
    "error::varda.common.deprecation.VardaDeprecationWarning",
    "ignore:The pvl.collections.Units object is deprecated:PendingDeprecationWarning",
]

[tool.mypy]
disable_error_code = ["import-untyped"]

[tool.importlinter]
root_package = "varda"
include_external_packages = true

# Logic stays testable without a GUI: these modules may not reach PyQt6,
# directly or through other modules. External packages are single nodes.
# ignore_imports is today's allowlist of known exceptions (study item D4);
# shrink it, never grow it.
[[tool.importlinter.contracts]]
name = "Logic modules don't use Qt"
type = "forbidden"
source_modules = [
    "varda.image_loading.data_sources",
    "varda.analysis",
    "varda.crism",
    "varda.rois.roi_collection",
    "varda.rois.roi_calculations",
    "varda.rois.roi_drawing_state",
    "varda.points.point_collection",
    "varda.workspaces.spectral_hourglass.hourglass_model",
    "varda.common.spectral_axis",
    "varda.spectral_libraries",
    "varda.common.expressions",
    "varda.common.grid",
    "varda.common.display_grid",
    "varda.common.provenance",
    "varda.common.memory",
    "varda.common.parameter",
    "varda.updates",
    "varda.mosaicking",
    "varda.catalogs",
    "varda.geo",
    "varda.lines.profile",
    "varda.lines.line_collection",
    "varda.terrain.scene",
    "varda.terrain.overlays",
    "varda.terrain.solid",
    "varda.terrain.vectors",
    "varda.terrain.animation",
    "varda.terrain.shape_scene",
    "varda.workspaces.linked_images.linking",
    "varda.workspaces.crism_ratio.mapping",
    "varda.vector_import",
    "varda.shapes",
]
forbidden_modules = ["PyQt6"]
ignore_imports = [
    # Color.toQColor / fromQColor in the shared entities
    "varda.common.entities -> PyQt6",
    # An analysis may offer a preview widget
    "varda.analysis.analysis -> PyQt6",
    # The PyTorch runtime finds its folder with QStandardPaths
    "varda.optional_features.torch_runtime -> PyQt6",
    # GUI that lives in the analysis package: the run dialog, the runner,
    # the eigenvalue plot, and createPreviewWidget helpers
    "varda.analysis.dialog -> **",
    "varda.analysis.runner -> **",
    "varda.analysis.eigenvalue_dialog -> **",
    "varda.analysis.eigenvalue_plot -> **",
    "varda.analysis.fatt_dialog -> **",
    "varda.analysis.library_picker -> **",
    "varda.analysis.transforms -> PyQt6",
    "varda.analysis.band_math -> PyQt6",
    "varda.analysis.band_math -> varda.common.parameter_widgets",
    "varda.analysis.geometry -> PyQt6",
    "varda.analysis.crop_preview -> **",
]
