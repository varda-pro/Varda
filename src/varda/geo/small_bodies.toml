# Small-body values Varda needs that PROJ's IAU_2015 authority lacks: the
# bodies it has no CRS for (Bennu, Ryugu, Didymos, Dimorphos, Arrokoth), and
# the density and rotation period of bodies it knows. Every value carries its
# own citation in [<body>.sources], and each was read from that source.
#
# naifId: NAIF ID (NAIF IDs Required Reading); only for bodies PROJ lacks
# meanRadius: m, radius of the volume-equivalent sphere
# rotationPeriodH: sidereal rotation period, hours
# density: [value, 1 sigma], kg/m^3
# shape: "sphere-like", "ellipsoid-like" or "irregular"; when absent, the
#        rule in bodies.py decides from the IAU 2015 radii

[Bennu]
naifId = 2101955
meanRadius = 244.0
rotationPeriodH = 4.296061
density = [1190.0, 13.0]
shape = "irregular"

[Bennu.sources]
naifId = "NAIF IDs Required Reading (2101955 BENNU)"
meanRadius = "Barnouin et al. (2019), Nat. Geosci. 12, 247-252, Table 1: average radius (volume-equivalent sphere) 244 m"
rotationPeriodH = "Hergenrother et al. (2019), Nat. Commun. 10, 1291: 4.296061 ± 0.000002 h at the J2000 epoch"
density = "Barnouin et al. (2019), Nat. Geosci. 12, 247-252, Table 1: 1190 ± 13 kg/m³"
shape = "Barnouin et al. (2019): top-shaped rubble pile"

